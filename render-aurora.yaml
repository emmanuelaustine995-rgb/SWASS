services:
  - type: web
    name: e-receipt-aurora-api
    runtime: node
    plan: free
    region: singapore
    rootDir: aurora-api
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AURORA_DATABASE_URL
        sync: false
      - key: AURORA_JWT_SECRET
        generateValue: true
      - key: AURORA_CORS_ORIGINS
        sync: false
      - key: TALKSASA_API_TOKEN
        sync: false
      - key: TALKSASA_SENDER_ID
        value: TALK-SASA
      - key: TALKSASA_API_URL
        value: https://bulksms.talksasa.com/api/v3/sms/send
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: WHATSAPP_PROVIDER
        value: cloud
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v22.0
      - key: FLARESEND_API_KEY
        sync: false
      - key: TUMA_API_KEY
        sync: false
      - key: TUMA_BUSINESS_EMAIL
        value: Kenyavat93@gmail.com
  - type: web
    name: e-receipt-aurora-web
    runtime: static
    rootDir: aurora
    buildCommand: echo "Publishing E-RECEIPT AURORA"
    staticPublishPath: .
