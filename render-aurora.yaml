services:
  - type: web
    name: e-receipt-aurora-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate:node && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SWASS_ID_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://e-receipt-aurora-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://e-receipt-aurora-web.onrender.com
      - key: PUBLIC_API_URL
        value: https://e-receipt-aurora-api.onrender.com
      - key: CASHIER_MAX_DISCOUNT_PCT
        value: "5"
      - key: TUMA_BUSINESS_EMAIL
        value: Kenyavat93@gmail.com
      - key: TUMA_API_KEY
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: MPESA_ENV
        value: sandbox
      - key: TALKSASA_API_TOKEN
        sync: false
      - key: TALKSASA_SENDER_ID
        value: TALK-SASA
      - key: TALKSASA_API_URL
        value: https://bulksms.talksasa.com/api/v3/sms/send
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: WHATSAPP_PROVIDER
        value: cloud
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v22.0
      - key: FLARESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
  - type: web
    name: e-receipt-aurora-web
    runtime: static
    rootDir: aurora
    buildCommand: echo "Publishing E-RECEIPT AURORA"
    staticPublishPath: .
