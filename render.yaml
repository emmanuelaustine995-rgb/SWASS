services:
  - type: web
    name: swass-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate:node && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SWASS_ID_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://swass-web.onrender.com
      - key: CASHIER_MAX_DISCOUNT_PCT
        value: "5"
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      # Tuma collects SWASS subscription and wallet payments.
      - key: TUMA_BUSINESS_EMAIL
        value: Kenyavat93@gmail.com
      - key: TUMA_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://swass-web.onrender.com
      # TalkSasa is the active provider for signup and receipt-recovery OTPs.
      - key: TALKSASA_API_TOKEN
        sync: false
      - key: TALKSASA_SENDER_ID
        value: TALK-SASA
      - key: TALKSASA_API_URL
        value: https://bulksms.talksasa.com/api/v3/sms/send
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

  - type: web
    name: swass-web
    runtime: static
    rootDir: frontend
    buildCommand: echo "Publishing SWASS frontend"
    staticPublishPath: .
