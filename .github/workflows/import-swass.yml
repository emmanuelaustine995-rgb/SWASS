name: Import SWASS project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f SWASS-Render-Ready.zip
          mkdir -p /tmp/swass-import
          unzip -q SWASS-Render-Ready.zip -d /tmp/swass-import
          test -d /tmp/swass-import/swass-pos-work
          cp -a /tmp/swass-import/swass-pos-work/. .
          # GitHub App token cannot push workflow-file changes.
          rm -f .github/workflows/ci.yml
          rm -f SWASS-Render-Ready.zip swass-api-updated.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: import complete SWASS project structure"
            git push
          fi
