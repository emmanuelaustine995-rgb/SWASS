name: Build SWASS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-swass-apk.yml"
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SWASS
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: gradle -p android-app assembleDebug
      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: SWASS-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swass-android-latest
          name: SWASS Android APK (Latest)
          target_commitish: main
          prerelease: true
          make_latest: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
