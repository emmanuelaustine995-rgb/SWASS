name: SWASS API checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swass_test
          POSTGRES_USER: swass_test
          POSTGRES_PASSWORD: swass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swass_test -d swass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://swass_test:swass_test@localhost:5432/swass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - name: Check every JavaScript file
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 node --check
      - name: Test controller and method role enforcement
        run: node --test test/roles-guard.test.mjs
      - name: Prevent ordinary and Platform Admin login from being mixed
        run: node --test test/platform-admin-separation.test.mjs
      - name: Reject unresolved Git conflict markers
        run: if grep -RInE '^(<<<<<<< |=======|>>>>>>> )' --exclude-dir=.git --exclude-dir=node_modules .; then echo 'Unresolved conflict markers found'; exit 1; else echo 'No unresolved conflict markers'; fi
      - run: npm run migrate:node
      - run: node test/verify-declaration-migration.mjs
      - run: npm run build
