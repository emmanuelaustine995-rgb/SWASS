name: SWASS API checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: swass_test
          POSTGRES_USER: swass_test
          POSTGRES_PASSWORD: swass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swass_test -d swass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://swass_test:swass_test@localhost:5432/swass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - run: node --check frontend/app.js && node --check frontend/recover.js && node --check frontend/dashboard.js && node --check frontend/sw.js
      - run: npm run migrate:node
      - run: node test/verify-declaration-migration.mjs
      - run: npm run build
