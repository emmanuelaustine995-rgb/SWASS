<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify email · E-RECEIPT AURORA</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f2f7f4;color:#173b2d;font-family:Arial,sans-serif}.card{width:min(100%,440px);background:#fff;border:1px solid #dce9e1;border-radius:18px;padding:28px;box-shadow:0 12px 36px #173b2d12;text-align:center}h1{font-size:23px;margin:0 0 12px}.muted{color:#65786e;line-height:1.55}#status{margin-top:20px;padding:14px;border-radius:10px;background:#f1f6f3}a{color:#176b4a;font-weight:700}
</style>
</head>
<body><main class="card"><h1>E-RECEIPT AURORA</h1><p class="muted">Confirming your business email address. Please keep this page open.</p><div id="status" role="status" aria-live="polite">Verifying your email…</div><p class="muted"><a href="/">Return to E-RECEIPT</a></p></main>
<script>
(async()=>{const status=document.getElementById('status');const token=new URLSearchParams(location.search).get('token');if(!token){status.textContent='This verification link is incomplete. Request a new verification email.';return}try{const response=await fetch('https://e-receipt-aurora-api.onrender.com/api/v1/auth/email-verification/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'This verification link is invalid or has expired.');status.textContent='Your email address has been verified successfully. You can now return to E-RECEIPT.';}catch(error){status.textContent=error.message||'Email verification could not be completed. Please request a new link.';}})();
</script></body></html>
