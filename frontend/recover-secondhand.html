<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075bd8"><title>Recover Second-Hand Goods Receipt | AURORA</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="auth-shell"><section class="panel">
<p class="page-back-row"><a class="btn btn-light page-back-link" href="index.html" onclick="if(window.history.length>1){event.preventDefault();window.history.back();}">← Back to AURORA</a></p>
<h1>Recover Second-Hand Goods Receipt</h1>
<p>Enter the seller's National ID and phone number. A KSh 50 M-Pesa payment unlocks the saved Second-Hand Goods Special Receipt.</p>
<form id="special-request-form">
<label>Seller National ID<input id="special-national-id" type="text" autocomplete="off" maxlength="40" placeholder="Seller National ID" required></label>
<label>Seller phone number<input id="special-phone" type="tel" autocomplete="tel" placeholder="07XXXXXXXX or 2547XXXXXXXX" required></label>
<button id="special-request-button" type="submit">Pay KSh 50 and recover receipt</button>
</form>
<p id="special-message" role="status" aria-live="polite"></p><div id="special-receipt-list"></div>
</section></main><script src="config.js"></script><script src="recover-secondhand.js"></script></body></html>
