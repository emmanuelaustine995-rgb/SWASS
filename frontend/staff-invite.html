<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075bd8"><title>Accept Staff Invitation | AURORA E-RECEIPT</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell" style="max-width:560px;padding-top:8vh"><section class="panel"><p class="eyebrow">AURORA E-RECEIPT</p><h1>Accept your staff invitation</h1><p class="muted">Create your own private password to activate your staff account.</p>
<form id="accept-form"><label>New password<input id="new-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required placeholder="At least 10 characters"></label><label>Confirm password<input id="confirm-password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button id="accept-button" class="btn btn-primary full" type="submit">Accept invitation</button></form>
<p id="message" role="status" class="muted"></p><p id="login-link" class="hidden"><a href="./index.html">Go to staff sign in</a></p></section></main>
<script src="./config.js"></script><script>
(()=>{const form=document.getElementById('accept-form'),message=document.getElementById('message'),button=document.getElementById('accept-button');const token=new URLSearchParams(location.search).get('token')||'';if(!token){form.classList.add('hidden');message.textContent='This invitation link is missing its security token. Ask the shop owner to send another invitation.';return;}form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('new-password').value,confirm=document.getElementById('confirm-password').value;if(password.length<10){message.textContent='Use at least 10 characters.';return;}if(password!==confirm){message.textContent='The passwords do not match.';return;}button.disabled=true;button.textContent='Activating…';message.textContent='';try{const response=await fetch((window.SWASS_API_URL||'https://swass-api.onrender.com').replace(/\\/$/,'')+'/api/v1/staff/invitations/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'Could not activate your account.');form.classList.add('hidden');message.textContent=data.message||'Your account is ready.';document.getElementById('login-link').classList.remove('hidden');}catch(error){message.textContent=error.message||'Could not activate your account.';}finally{button.disabled=false;button.textContent='Accept invitation';}});})();
</script></body></html>
