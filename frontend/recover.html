<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover SWASS receipt</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-shell"><section class="panel"><h1>Recover a receipt</h1><p>Enter the phone number used when the receipt was issued. We will send a one-time verification code.</p><form id="request-form"><label>Phone number<input id="phone" type="tel" autocomplete="tel" placeholder="07XXXXXXXX or 2547XXXXXXXX" required></label><button type="submit">Send verification code</button></form><form id="verify-form" class="hidden"><label>Enter the OTP sent to your phone<input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Enter 6-digit OTP" required></label><p id="resend-area" aria-live="polite"></p><button id="verify-submit" type="submit">Verify and find receipts</button><button id="resend-button" type="button" disabled>Resend OTP</button></form><p id="message" role="status"></p><div id="receipt-list"></div><p><a href="index.html">Back to SWASS POS</a></p></section></main><script src="config.js"></script><script src="recover.js"></script></body></html>
